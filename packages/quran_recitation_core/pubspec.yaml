name: quran_recitation_core
description: >-
  Pure-Dart core for the live Quran recitation feedback engine: phoneme
  chunking, word/phrase alignment, phrase-boundary classification, and
  per-ayah result types. No Flutter, no ML, no audio dependencies — those
  live in adapter packages that depend on this one.
version: 0.3.1
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  meta: ^1.12.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
